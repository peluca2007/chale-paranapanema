name: Deploy no GitHub Pages

# Toda vez que você der push na branch main, o site é compilado e publicado.
on:
  push:
    branches: [main]
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Dados privados são opcionais: cadastre em Settings > Secrets and variables > Actions > Variables.
      # Sem eles, o GitHub Pages publica a versão de demonstração (sem WhatsApp, Airbnb ou senha).
      - run: npm run build
        env:
          VITE_AIRBNB_URL: ${{ vars.VITE_AIRBNB_URL }}
          VITE_WHATSAPP: ${{ vars.VITE_WHATSAPP }}
          VITE_KEY_WHATSAPP: ${{ vars.VITE_KEY_WHATSAPP }}
          VITE_WIFI_NETWORK: ${{ vars.VITE_WIFI_NETWORK }}
          VITE_WIFI_PASSWORD: ${{ vars.VITE_WIFI_PASSWORD }}
          VITE_GITHUB_URL: ${{ vars.VITE_GITHUB_URL }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # destrava uma publicação anterior que ficou presa em "em andamento"
      - name: Cancelar publicação travada
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/deployments/2786563e02e9b3d08bca6bc4c68af903cceacc37/cancel
      - id: deployment
        uses: actions/deploy-pages@v4
